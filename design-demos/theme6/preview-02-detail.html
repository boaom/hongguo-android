<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1"><title>02-detail</title>
<style>
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --surface:#F3F4F6; --card:#FFFFFF; --ink:#16181B; --muted:#63676D;
    --hair:#E2E4E8; --brand:#C8102E; --onbrand:#FFFFFF;
    --radius:14px; --poster:10px;
  }
  body { background:#191A1C; font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
         padding:32px 36px 56px; color:#DADCE0; -webkit-font-smoothing:antialiased; }
  .head { max-width: 1180px; margin: 0 auto 22px; display:flex; justify-content:space-between; align-items:flex-end; }
  .head h1 { font-size:17px; font-weight:600; letter-spacing:.01em; color:#F3F4F6; }
  .head p { font-size:12px; color:#8E9094; margin-top:5px; line-height:1.6; }
  .head .tag { font-size:11px; color:#8E9094; font-family: ui-monospace, monospace; letter-spacing:.06em; }
  .row { display:flex; gap:26px; justify-content:center; flex-wrap:wrap; }
  .frame { width:390px; }
  .frame .lb { font-size:11px; color:#8E9094; margin-bottom:8px; display:flex; justify-content:space-between; }
  .device { width:390px; height:844px; border-radius:26px; overflow:hidden; position:relative;
            background:var(--surface); color:var(--ink); }
  .dark { --surface:#0F1113; --card:#17191C; --ink:#F3F4F6; --muted:#A0A4AB; --hair:#262A2E; --brand:#E2263A; }

  /* 状态栏 */
  .sb { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 20px;
        font-size:12px; color:var(--ink); font-variant-numeric: tabular-nums; }

  /* 集刻度：JS 生成 */
  .rail { display:flex; align-items:flex-end; gap:1px; height:18px; width:100%; }
  .rail i { flex:1 1 0; min-width:1px; height:8px; background:var(--hair); }
  .rail i.done { background:var(--brand); height:13px; }
  .rail i.cur { background:var(--brand); height:18px; }
  .rail.sm { height:10px; }
  .rail.sm i { height:4px; } .rail.sm i.done { height:6px; } .rail.sm i.cur { height:10px; }
  .rail.lg { height:26px; } .rail.lg i { height:10px; } .rail.lg i.done { height:17px; } .rail.lg i.cur { height:26px; }
  .railnote { font-size:10.5px; color:var(--muted); letter-spacing:.01em; }

  /* 顶栏 */
  .top { display:flex; align-items:baseline; justify-content:space-between; padding:6px 20px 0; }
  .top b { font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .top span { font-size:12px; color:var(--muted); font-variant-numeric: tabular-nums; }
  .h1 { padding:16px 20px 2px; display:flex; align-items:baseline; justify-content:space-between; }
  .h1 .eb { font-size:13px; color:var(--muted); letter-spacing:.01em; }
  .h1 h2 { font-size:13px; font-weight:600; letter-spacing:0; color:var(--ink); font-variant-numeric:tabular-nums; }

  /* 继续观看 */
  .cont { margin:16px 20px 0; background:var(--card); border-radius:var(--radius); padding:14px;
          display:flex; gap:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .cont .p { width:96px; height:162px; border-radius:var(--poster); overflow:hidden; flex:none; background:#ddd; }
  .cont .p img { width:100%; height:100%; object-fit:cover; display:block; }
  .cont .b { flex:1; min-width:0; display:flex; flex-direction:column; gap:0; }
  .cont .b .t { font-size:17px; line-height:23px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cont .b .m { font-size:13px; color:var(--muted); margin-top:6px; font-variant-numeric: tabular-nums; }
  .cont .b .r { margin-top:14px; }
  .cont .b .rl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted);
                 margin-top:8px; font-variant-numeric: tabular-nums; }
  .cta { margin-top:12px; height:48px; border-radius:10px; background:var(--brand); color:var(--onbrand);
         display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; }

  /* 区块 */
  .sec { margin:24px 20px 0; }
  .sec .st { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .sec .st b { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .sec .st b em { font-style:normal; color:var(--muted); font-weight:500; font-size:12px; margin-left:6px; }
  .sec .st span { font-size:12px; color:var(--muted); }

  /* 更新行 */
  .upd { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--hair); }
  .upd:last-child { border-bottom:0; }
  .upd .tm { width:44px; flex:none; font-size:13px; font-weight:600; font-variant-numeric: tabular-nums; }
  .upd .tm i { display:block; font-style:normal; font-size:10px; color:var(--muted); font-weight:400; }
  .upd .p { width:40px; height:54px; border-radius:6px; overflow:hidden; flex:none; }
  .upd .p img { width:100%; height:100%; object-fit:cover; display:block; }
  .upd .b { flex:1; min-width:0; }
  .upd .b b { display:block; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .upd .b .m { font-size:12px; color:var(--muted); margin-top:3px; font-variant-numeric: tabular-nums; }

  /* 三列 */
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px 12px; }
  .gd .p { width:100%; aspect-ratio:3/4.2; border-radius:var(--poster); overflow:hidden; }
  .gd .p img { width:100%; height:100%; object-fit:cover; display:block; }
  .gd .t { font-size:13.5px; line-height:18px; margin-top:7px; font-weight:500;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .gd .m { font-size:12px; color:var(--muted); margin-top:4px; font-variant-numeric: tabular-nums; }

  /* 底栏 */
  .nav { position:absolute; left:0; right:0; bottom:0; height:74px; background:var(--card);
         border-top:1px solid var(--hair); display:flex; padding-bottom:10px; }
  .nav i { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:3px; font-size:12px; color:var(--muted); font-style:normal; }
  .nav i.on { color:var(--brand); }
  .nav i svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.4;
                stroke-linejoin:round; stroke-linecap:round; }
  .nav i em { font-style:normal; }
  .nav i.on em { font-weight:600; }

  /* 详情页 */
  .dtop { display:flex; align-items:center; gap:10px; padding:2px 20px 0; height:40px; }
  .dtop .bk { width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--ink); }
  .dtop .sp { flex:1; font-size:13px; color:var(--muted); text-align:center; }
  .dhero { display:flex; gap:14px; padding:8px 20px 0; }
  .dhero .p { width:104px; height:147px; border-radius:var(--poster); overflow:hidden; flex:none; }
  .dhero .p img { width:100%; height:100%; object-fit:cover; display:block; }
  .dhero .b { flex:1; min-width:0; padding-top:2px; }
  .dhero .b h3 { font-size:21px; line-height:27px; font-weight:700; letter-spacing:-.01em; }
  .dhero .b .m { font-size:13px; color:var(--muted); margin-top:7px; line-height:1.7; font-variant-numeric: tabular-nums; }
  .dhero .b .tag { display:inline-block; font-size:11px; color:var(--brand); border:1px solid var(--brand);
                   border-radius:4px; padding:0 5px; line-height:17px; margin-top:8px; }

  .bigrail { margin:20px 20px 0; }
  .bigrail .rl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted);
                 margin-top:8px; font-variant-numeric: tabular-nums; }
  .bigrail .rlt { font-size:15px; font-weight:600; margin-bottom:10px; font-variant-numeric: tabular-nums; }
  .bigrail .rlt em { font-style:normal; color:var(--muted); font-weight:400; font-size:12px; }

  .eps { margin:18px 20px 0; }
  .eps .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px; }
  .eps .grid b { height:48px; border-radius:8px; background:var(--card); border:1px solid var(--hair);
                 display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:500;
                 font-variant-numeric: tabular-nums; }
  .eps .grid b.done { color:var(--muted); }
  .eps .grid b.cur { background:var(--brand); border-color:var(--brand); color:var(--onbrand); font-weight:600; }
  .dsum { margin:20px 20px 0; font-size:15px; line-height:23px; color:var(--muted); }
  .dsum b { color:var(--ink); font-weight:600; }

  /* 追更页 */
  .lib { margin:8px 20px 0; }
  .li { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--hair); }
  .li .p { width:56px; height:76px; border-radius:8px; overflow:hidden; flex:none; }
  .li .p img { width:100%; height:100%; object-fit:cover; display:block; }
  .li .b { flex:1; min-width:0; }
  .li .b b { font-size:16px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .li .b .m { font-size:12.5px; color:var(--muted); margin-top:4px; font-variant-numeric: tabular-nums; }
  .li .r { width:100%; margin-top:8px; }
  .li .rl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:5px;
            font-variant-numeric: tabular-nums; }

  .note { max-width:1180px; margin:24px auto 0; font-size:12px; color:#8E9094; line-height:1.9; }
  .note b { color:#DADCE0; font-weight:600; }

html,body { background:#F3F4F6; margin:0; padding:0; }
body { width:390px; }
.device { border-radius:0; width:390px; height:844px; }
</style></head>
<body>
<div class="device">
      <div class="sb"><span>20:15</span><span>5G ▮▮▮</span></div>
      <div class="dtop"><div class="bk">‹</div><div class="sp">装穷提亲，娶到全家嫌弃的她</div><div class="bk">⋯</div></div>

      <div class="dhero">
        <div class="p"><img src="../posters/zhuangqiong.jpg"></div>
        <div class="b">
          <h3>装穷提亲，娶到全家嫌弃的她</h3>
          <div class="m">全 80 集 · 都市 · 每集 2 分钟<br>更新至第 12 集 · 4.2 亿次播放</div>
          <div class="tag">更新中</div>
        </div>
      </div>

      <div class="bigrail">
        <div class="rlt">看到第 3 集 <em>· 还剩 77 集，约 2 小时 34 分</em></div>
        <div class="rail lg" data-total="80" data-done="3"></div>
        <div class="rl"><span>1</span><span>20</span><span>40</span><span>60</span><span>80</span></div>
      </div>

      <div class="eps">
        <div class="st" style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-size:15px;font-weight:700">选集</b><span style="font-size:12px;color:var(--muted)">更新至 12</span>
        </div>
        <div class="grid">
          <b class="done">1</b><b class="done">2</b><b class="cur">3</b><b>4</b><b>5</b><b>6</b>
          <b>7</b><b>8</b><b>9</b><b>10</b><b>11</b><b>12</b>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">明天 12:00 更新第 13 集</div>
      </div>

      <div class="dsum"><b>简介</b><br>他装成穷小子去提亲，全村人都笑她嫁了个废物。三年后，村口停满了黑色的车。</div>

      <div class="nav" style="border-top:1px solid var(--hair)">
        <div style="flex:1;padding:0 20px;display:flex;align-items:center">
          <div class="cta" style="width:100%;margin:0;height:48px">播放第 4 集 · 02:10</div>
        </div>
      </div>
    </div>
<script>
document.querySelectorAll('.rail').forEach(function (r) {
  var total = parseInt(r.dataset.total, 10) || 0;
  var done = parseInt(r.dataset.done, 10) || 0;
  // 每个刻度至少要有 ~2px 才读得出，否则按比例抽样（80 集→40 格，1000 集→50 格）
  var cap = r.classList.contains('sm') ? 60 : (r.classList.contains('lg') ? 140 : 100);
  var shown = Math.min(total, cap);
  var per = total / shown;
  var frag = document.createDocumentFragment();
  for (var i = 0; i < shown; i++) {
    var t = document.createElement('i');
    var from = i * per, to = (i + 1) * per;
    if (to <= done - 1 + 0.001) t.className = 'done';
    else if (from < done && done <= to) t.className = 'cur';
    frag.appendChild(t);
  }
  r.appendChild(frag);
  if (per > 1) r.title = '每格 ' + Math.round(per) + ' 集';
});
</script>
</body></html>
